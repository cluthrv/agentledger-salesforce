<template>
    <lightning-card title="Agent Activity" icon-name="custom:custom55">
        <lightning-button-icon slot="actions" icon-name="utility:refresh" alternative-text="Refresh"
            title="Refresh" onclick={handleRefresh}></lightning-button-icon>

        <div class="slds-p-horizontal_medium">
            <template lwc:if={loadError}>
                <p class="slds-text-color_error">Could not load agent activity: {loadError}</p>
            </template>

            <template lwc:if={isEmpty}>
                <p class="slds-text-color_weak slds-p-vertical_small">No agent activity on this record yet.</p>
            </template>

            <template for:each={runs} for:item="run">
                <section key={run.runId} class="run">
                    <div class="run-header">
                        <div class="run-info">
                            <div class="run-title">
                                <span class="agent">{run.agent}</span>
                                <span class={run.statusClass}>{run.status}</span>
                                <template lwc:if={run.showIntegrity}>
                                    <span class={run.integrityClass}>{run.integrityLabel}</span>
                                </template>
                            </div>
                            <div class="slds-text-body_small slds-text-color_weak">
                                <a href={run.runUrl}>{run.name}</a>
                                <template lwc:if={run.startedBy}><span> · started by {run.startedBy}</span></template>
                                <span> · </span>
                                <lightning-formatted-date-time value={run.startTime} year="numeric" month="short"
                                    day="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                                <span> · {run.stepsLabel} · {run.modeLabel}</span>
                                <template lwc:if={run.hasVerifiedTime}>
                                    <span> · checked </span>
                                    <lightning-formatted-date-time value={run.lastVerifiedAt} month="short" day="numeric"
                                        hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                                </template>
                            </div>
                            <template lwc:if={run.hasActedUnder}>
                                <div class="slds-text-body_small slds-m-top_xx-small acted-under">
                                    <span>Acted under </span>
                                    <template lwc:if={run.agentVersion}><strong>{run.agentVersion}</strong></template>
                                    <template lwc:if={run.policyReference}><span> · policy </span><strong>{run.policyReference}</strong></template>
                                    <template lwc:if={run.snapshotUrl}><span> · </span><a href={run.snapshotUrl}>view instructions</a></template>
                                </div>
                            </template>
                            <template lwc:if={run.otherRecord}>
                                <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                    This run was about another record; it also touched this one.
                                </div>
                            </template>
                        </div>
                        <lightning-button-group class="run-actions">
                            <template lwc:if={run.showVerify}>
                                <lightning-button label="Verify" icon-name="utility:shield" data-run-id={run.runId}
                                    onclick={handleVerify} disabled={run.isVerifying}></lightning-button>
                            </template>
                            <lightning-button label="Check history" icon-name="utility:record_lookup" data-run-id={run.runId}
                                title="Compare this run with the field changes Salesforce recorded in Field History"
                                onclick={handleReconcile} disabled={run.isReconciling}></lightning-button>
                            <template lwc:if={run.showExport}>
                                <lightning-button label="Export" icon-name="utility:download" data-run-id={run.runId}
                                    title="Download this run to verify it outside Salesforce"
                                    onclick={handleExport} disabled={run.isExporting}></lightning-button>
                            </template>
                        </lightning-button-group>
                    </div>

                    <template lwc:if={run.reconcile}>
                        <div class={run.reconcile.boxClass}>
                            <p>{run.reconcile.summary}</p>
                            <template lwc:if={run.reconcile.hasMissing}>
                                <ul class="slds-list_dotted slds-m-top_xx-small">
                                    <template for:each={run.reconcile.missing} for:item="m">
                                        <li key={m.key}>
                                            {m.objectName} {m.recordId}: <strong>{m.fieldLabel}</strong> {m.before} → {m.after},
                                            <lightning-formatted-date-time value={m.changedAt} month="short" day="numeric"
                                                hour="2-digit" minute="2-digit" second="2-digit"></lightning-formatted-date-time>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                        </div>
                    </template>

                    <ol class="entries">
                        <template for:each={run.entries} for:item="entry">
                            <li key={entry.entryId} class="entry">
                                <lightning-icon icon-name={entry.icon} size="x-small" class="entry-icon"
                                    alternative-text={entry.typeLabel}></lightning-icon>
                                <div class="entry-body">
                                    <div class="entry-line">
                                        <span class="entry-type">{entry.typeLabel}</span>
                                        <span class="entry-summary">{entry.summaryText}</span>
                                    </div>
                                    <div class="slds-text-body_small slds-text-color_weak">
                                        <span class={entry.captureClass}>{entry.captureLabel}</span>
                                        <span> · </span>
                                        <lightning-formatted-date-time value={entry.timestamp} hour="2-digit"
                                            minute="2-digit" second="2-digit"></lightning-formatted-date-time>
                                        <template lwc:if={entry.elsewhere}>
                                            <span> · on </span><a href={entry.elsewhereUrl}>{entry.targetObject}</a>
                                        </template>
                                        <span> · </span>
                                        <button class="slds-button link-button" data-entry-id={entry.entryId}
                                            onclick={handleToggle}>{entry.toggleLabel}</button>
                                    </div>

                                    <template lwc:if={entry.hasFieldChanges}>
                                        <table class="changes slds-table slds-table_bordered slds-table_cell-buffer">
                                            <thead>
                                                <tr><th>Field</th><th>Before</th><th>After</th></tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={entry.fieldChangeRows} for:item="c">
                                                    <tr key={c.key}><td>{c.label}</td><td>{c.before}</td><td>{c.after}</td></tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </template>
                                    <template lwc:if={entry.hasHidden}>
                                        <p class="slds-text-body_small slds-text-color_weak">{entry.hiddenLabel}</p>
                                    </template>

                                    <template lwc:if={entry.isExpanded}>
                                        <dl class="details">
                                            <template lwc:if={entry.reasoning}>
                                                <dt>Why</dt><dd>{entry.reasoning}</dd>
                                            </template>
                                            <template lwc:if={entry.inputContext}>
                                                <dt>Looked at</dt><dd class="pre">{entry.inputContext}</dd>
                                            </template>
                                            <template lwc:if={entry.outputResult}>
                                                <dt>Result</dt><dd class="pre">{entry.outputResult}</dd>
                                            </template>
                                            <template lwc:if={entry.policyReference}>
                                                <dt>Policy</dt><dd>{entry.policyReference}</dd>
                                            </template>
                                            <template lwc:if={entry.hash}>
                                                <dt>Hash</dt><dd class="hash">{entry.hash}</dd>
                                            </template>
                                        </dl>
                                    </template>
                                </div>
                            </li>
                        </template>
                    </ol>
                </section>
            </template>

            <template lwc:if={hasMore}>
                <div class="slds-align_absolute-center slds-p-vertical_small">
                    <lightning-button label="Show older runs" onclick={handleShowOlder} disabled={isLoading}></lightning-button>
                </div>
            </template>
            <template lwc:if={isLoading}>
                <div class="spinner-holder"><lightning-spinner size="small" alternative-text="Loading"></lightning-spinner></div>
            </template>
        </div>
    </lightning-card>
</template>
